<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Admission Portal - Practical Lab Assignment</title>
    <style>
        /* Classic college lab assignment styling - made to look clean yet student-made */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f0f2f5;
            color: #333333;
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 650px;
            margin: 30px auto;
            background: #ffffff;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 22px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 13px;
            color: #ecf0f1;
        }

        .form-body {
            padding: 25px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 5px;
            color: #2c3e50;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="tel"],
        select {
            width: 100%;
            padding: 10px;
            font-size: 14px;
            border: 1px solid #b2bec3;
            border-radius: 4px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: #3498db;
        }

        .radio-group {
            display: flex;
            gap: 20px;
            margin-top: 5px;
        }

        .radio-group label {
            font-weight: normal;
            display: inline;
            cursor: pointer;
        }

        /* Plain error message style in red text below fields */
        .error-message {
            color: #d63031;
            font-size: 12px;
            margin-top: 4px;
            display: block;
            min-height: 16px;
        }

        .btn-container {
            text-align: center;
            margin-top: 25px;
        }

        button {
            background-color: #2980b9;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #1f618d;
        }

        /* Success Modal / Message Box */
        #successBox {
            display: none;
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
        }

        .footer-note {
            background-color: #f8f9fa;
            border-top: 1px solid #e9ecef;
            padding: 12px;
            text-align: center;
            font-size: 12px;
            color: #6c757d;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>S.B Jain Institute of Technology, Management And Research</h1>
            <p>B.Tech Admissions Portal - Student Registration Form</p>
        </div>

        <div class="form-body">
            <!-- Success message container instead of alert() -->
            <div id="successBox">Registration form submitted successfully! Data verified by JavaScript.</div>

            <form id="registrationForm" novalidate>
                
                <!-- Full Name Field -->
                <div class="form-group">
                    <label for="fullName">Full Name: <span style="color:red;">*</span></label>
                    <input type="text" id="fullName" placeholder="Enter your full name">
                    <span id="nameError" class="error-message"></span>
                </div>

                <!-- Email Address Field -->
                <div class="form-group">
                    <label for="email">Email Address: <span style="color:red;">*</span></label>
                    <input type="email" id="email" placeholder="student@example.com">
                    <span id="emailError" class="error-message"></span>
                </div>

                <!-- Password Field -->
                <div class="form-group">
                    <label for="password">Password: <span style="color:red;">*</span></label>
                    <input type="password" id="password" placeholder="At least 6 characters">
                    <span id="passwordError" class="error-message"></span>
                </div>

                <!-- Mobile Number Field -->
                <div class="form-group">
                    <label for="mobile">Mobile Number: <span style="color:red;">*</span></label>
                    <input type="tel" id="mobile" placeholder="10-digit mobile number" maxlength="10">
                    <span id="mobileError" class="error-message"></span>
                </div>

                <!-- Course Selection Dropdown -->
                <div class="form-group">
                    <label for="course">Select Course: <span style="color:red;">*</span></label>
                    <select id="course">
                        <option value="">-- Choose Course --</option>
                        <option value="BTech">B.Tech Computer Science</option>
                        <option value="MCA">Master of Computer Applications (MCA)</option>
                        <option value="BBA">Bachelor of Business Administration</option>
                        <option value="BSc">B.Sc Information Technology</option>
                    </select>
                    <span id="courseError" class="error-message"></span>
                </div>

                <!-- Gender Radio Buttons -->
                <div class="form-group">
                    <label>Gender: <span style="color:red;">*</span></label>
                    <div class="radio-group">
                        <label><input type="radio" name="gender" value="Male"> Male</label>
                        <label><input type="radio" name="gender" value="Female"> Female</label>
                        <label><input type="radio" name="gender" value="Other"> Other</label>
                    </div>
                    <span id="genderError" class="error-message"></span>
                </div>

                <!-- Submit Button -->
                <div class="btn-container">
                    <button type="submit">Submit Registration</button>
                </div>
            </form>
        </div>

        <!-- Student lab assignment footer note -->
        <div class="footer-note">
        </div>
    </div>

    <script>
        /* 
          JavaScript Validation Script for College Admission Form
          Author: Rahul Sharma (MCA Sem-II)
          Description: Validates mandatory fields, email pattern, mobile number digits, and password length.
        */

        // Wait for DOM content to fully load
        document.addEventListener("DOMContentLoaded", function() {
            const form = document.getElementById("registrationForm");

            form.addEventListener("submit", function(event) {
                // Prevent default form submission to perform custom JS validations
                event.preventDefault();

                // Clear previous success messages
                document.getElementById("successBox").style.display = "none";

                // Fetch form input values
                const fullName = document.getElementById("fullName").value.trim();
                const email = document.getElementById("email").value.trim();
                const password = document.getElementById("password").value;
                const mobile = document.getElementById("mobile").value.trim();
                const course = document.getElementById("course").value;
                
                // Get selected gender radio button
                const genderOptions = document.getElementsByName("gender");
                let genderSelected = "";
                for (let i = 0; i < genderOptions.length; i++) {
                    if (genderOptions[i].checked) {
                        genderSelected = genderOptions[i].value;
                        break;
                    }
                }

                // Error message variables
                let isValid = true;

                // 1. Validate Full Name (Mandatory)
                const nameError = document.getElementById("nameError");
                if (fullName === "") {
                    nameError.textContent = "Full name is required.";
                    isValid = false;
                } else if (fullName.length < 3) {
                    nameError.textContent = "Name must be at least 3 characters long.";
                    isValid = false;
                } else {
                    nameError.textContent = "";
                }

                // 2. Validate Email Format
                const emailError = document.getElementById("emailError");
                // Standard email regex pattern checked by students
                const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (email === "") {
                    emailError.textContent = "Email address is required.";
                    isValid = false;
                } else if (!emailPattern.test(email)) {
                    emailError.textContent = "Please enter a valid email format (e.g. name@domain.com).";
                    isValid = false;
                } else {
                    emailError.textContent = "";
                }

                // 3. Validate Password Length (Minimum 6 characters)
                const passwordError = document.getElementById("passwordError");
                if (password === "") {
                    passwordError.textContent = "Password is required.";
                    isValid = false;
                } else if (password.length < 6) {
                    passwordError.textContent = "Password must be at least 6 characters long.";
                    isValid = false;
                } else {
                    passwordError.textContent = "";
                }

                // 4. Validate Mobile Number (Exactly 10 digits numeric)
                const mobileError = document.getElementById("mobileError");
                const mobilePattern = /^[0-9]{10}$/;
                if (mobile === "") {
                    mobileError.textContent = "Mobile number is required.";
                    isValid = false;
                } else if (!mobilePattern.test(mobile)) {
                    mobileError.textContent = "Mobile number must be exactly 10 digits.";
                    isValid = false;
                } else {
                    mobileError.textContent = "";
                }

                // 5. Validate Course Selection (Mandatory dropdown)
                const courseError = document.getElementById("courseError");
                if (course === "") {
                    courseError.textContent = "Please select a course.";
                    isValid = false;
                } else {
                    courseError.textContent = "";
                }

                // 6. Validate Gender Selection (Mandatory radio)
                const genderError = document.getElementById("genderError");
                if (genderSelected === "") {
                    genderError.textContent = "Please select your gender.";
                    isValid = false;
                } else {
                    genderError.textContent = "";
                }

                // Final check: If all inputs are valid, show success message
                if (isValid) {
                    const successBox = document.getElementById("successBox");
                    successBox.style.display = "block";
                    
                    // Optionally reset the form fields after successful validation
                    form.reset();

                    // Scroll to top to see success box
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            });
        });
    </script>
</body>
</html>
